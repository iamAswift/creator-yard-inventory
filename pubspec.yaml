name: supermarket_inventory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7   # latest stable version
  file_picker:
    path: packages/file_picker

  # State Management
  flutter_riverpod: ^2.6.1

  # SQLite
  drift: ^2.20.0
  shared_preferences: ^2.2.2
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^3.3.4
  logging: ^1.2.0   

  # Path
  path_provider: ^2.1.5
  path: ^1.9.0

  # Routing
  go_router: ^15.0.0

  # UI
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.0
  flutter_svg: ^2.0.10+1 

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # pdf 
  pdf: ^3.10.8
  printing: ^5.12.0
  barcode_widget: ^2.0.1
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  drift_dev: ^2.20.0
  build_runner: ^2.4.9
  # Lints
  flutter_lints: ^3.0.0
  flutter_gen_runner: ^5.4.0
  flutter_launcher_icons: ^0.14.4




flutter:
  
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/category/
    - assets/icons/
    - assets/fonts/Roboto-Regular.ttf
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf


